services:
  postgres:
    image: postgres:16-alpine
    container_name: together-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: together
    ports:
      - '5432:5432'
    volumes:
      - together-postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    container_name: together-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
volumes:
  together-postgres-data:
